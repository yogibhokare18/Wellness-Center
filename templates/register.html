<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wellness Center | Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            🌿 Wellness Center
        </div>

        <a href="/admin" class="admin-link">
            Admin
        </a>

    </nav>


    <!-- Registration Section -->
    <main class="page">

        <div class="registration-card">

            <div class="card-header">

                <div class="wellness-icon">
                    🌿
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Start your wellness journey with us
                </p>

            </div>


            <form action="/register"
                  method="POST"
                  id="registrationForm">


                <!-- Full Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Phone -->
                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10 digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required>

                </div>


                <!-- Gender -->
                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- DOB -->
                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob">

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your address"></textarea>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        required>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required>

                </div>


                <!-- Register -->
                <button type="submit" class="register-btn">

                    Create Account

                </button>

            </form>


            <p class="login-info">
                Already registered?
                <a href="/admin">Admin Login</a>
            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Wellness Center.
            All Rights Reserved.
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
